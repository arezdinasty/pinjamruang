<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

  <style>
    body { padding: 20px; background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .container { max-width: 1300px; }
    #calendar { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .hidden { display: none; }

    /* CSS UNTUK WRAP TEXT DI KALENDER */
    .fc-event { border: none !important; background: none !important; }
    .fc-event-main { white-space: normal !important; padding: 1px !important; }

    .event-card { 
      padding: 5px; 
      font-size: 0.85em; 
      border-radius: 4px; 
      white-space: normal !important; /* Paksa teks turun ke bawah */
      word-wrap: break-word;
      line-height: 1.3;
      min-height: 45px;
      display: block;
    }

    .event-card strong { color: #b71c1c; display: block; font-size: 0.8em; border-bottom: 1px solid rgba(0,0,0,0.1); margin-bottom: 2px; }

    /* Status Warna */
    .event-verif-disetujui { border-left: 4px solid #28a745; background-color: rgba(40, 167, 69, 0.15); color: #1e4627; }
    .event-verif-ditolak { border-left: 4px solid #dc3545; background-color: rgba(220, 53, 69, 0.15); color: #66191f; }
    .event-verif-dibatalkan { border-left: 4px solid #0d6efd; background-color: rgba(13, 110, 253, 0.15); color: #052c65; }
    .event-verif-kosong { border-left: 4px solid #ffc107; background-color: rgba(255, 193, 7, 0.2); color: #533f03; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .badge { font-size: 0.75em; }
    .text-nowrap { white-space: nowrap; }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="text-center">
      <div class="spinner-border text-primary mb-2"></div>
      <div class="fw-bold">Memuat Data Jadwal...</div>
    </div>
  </div>

  <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <input type="text" id="globalSearch" class="form-control" style="min-width: 250px;" placeholder="🔍 Cari kegiatan..." onkeyup="filterEvents()">
        <input type="text" id="dateRangeFilter" class="form-control w-auto" title="Filter Tanggal" />
        <select id="roomFilter" class="form-select w-auto" onchange="filterEvents()">
          <option value="ALL">Semua Ruangan</option>
        </select>
        <button class="btn btn-outline-success" onclick="refreshData()">🔄 Refresh</button>
      </div>

      <div class="btn-group shadow-sm">
        <button class="btn btn-primary active" id="btnCal" onclick="switchView('calendar-view', this)">Kalender</button>
        <button class="btn btn-outline-primary" id="btnTab" onclick="switchView('table-view', this)">Tabel</button>
      </div>
    </div>

    <div id="calendar-view"><div id="calendar"></div></div>

    <div id="table-view" class="hidden">
      <div class="table-responsive bg-white rounded shadow-sm p-3">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Hari, Tanggal</th>
              <th>Kegiatan</th>
              <th>Ruang</th>
              <th>Waktu</th>
              <th>Pemohon</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">📌 Detail Peminjaman Ruang</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="modalContent"></div>
      </div>
    </div>
  </div>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/locale/id.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/daterangepicker@3.1/daterangepicker.min.js"></script>

  <script>
    var calendar, allData = [], filteredData = [], bootstrapModal, currentDateRange = null;
    moment.locale('id'); // Set Bahasa Indonesia
    document.addEventListener('DOMContentLoaded', function() {
      bootstrapModal = new bootstrap.Modal(document.getElementById('eventModal'));
      initCalendar();
      refreshData();
    });

    function initCalendar() {
      var calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'id',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
        height: 'auto',
        dayMaxEvents: false, // Tampilkan semua agar wrap text terlihat
        eventContent: function(arg) {
          var v = (arg.event.extendedProps.verifKaur || "").toUpperCase();
          var cls = v.includes('DISETUJUI') ? 'event-verif-disetujui' : 
                    v.includes('DITOLAK') ? 'event-verif-ditolak' : 

                    v.includes('DIBATALKAN') ? 'event-verif-dibatalkan' : 'event-verif-kosong';
          return { 
            html: `<div class="event-card ${cls}">
                    <strong>[${arg.event.extendedProps.ruang}]</strong>
                    <div>${arg.event.title}</div>
                   </div>` 
          };
        },
        eventClick: function(info) { showDetail(info.event.extendedProps); }
      });
      calendar.render();
    }

    function refreshData() {
      $('#loading').show();
      google.script.run.withSuccessHandler(function(data) {
        allData = data;
        
        // Populate Ruangan Filter
        var rooms = [...new Set(data.map(i => i.ruang))].sort();
        var select = document.getElementById('roomFilter');
        select.innerHTML = '<option value="ALL">Semua Ruangan</option>';
        rooms.forEach(r => select.add(new Option(r, r)));

        // Init DateRangePicker
        $('#dateRangeFilter').daterangepicker({
          locale: { format: 'DD/MM/YYYY', applyLabel: "Pilih", cancelLabel: "Batal" },
          startDate: moment(),
          endDate: moment().add(1, 'months')
        }, function(start, end) {
          currentDateRange = { start: start.format('YYYY-MM-DD'), end: end.format('YYYY-MM-DD') };
          filterEvents();
        });
        filterEvents();
        $('#loading').hide();
      }).getData();
    }

    function filterEvents() {
      var search = document.getElementById('globalSearch').value.toLowerCase();
      var room = document.getElementById('roomFilter').value;

      filteredData = allData.filter(item => {
        var matchesSearch = !search || item.namaKegiatan.toLowerCase().includes(search) || item.ruang.toLowerCase().includes(search);
        var matchesDate = !currentDateRange || (item.tanggal >= currentDateRange.start && item.tanggal <= currentDateRange.end);
        var matchesRoom = room === "ALL" || item.ruang === room;
        return matchesSearch && matchesDate && matchesRoom;
      });

      // Update Kalender
      calendar.removeAllEvents();
      calendar.addEventSource(filteredData.map(i => ({
        title: i.namaKegiatan, 
        start: i.tanggal + 'T' + i.mulai, 
        end: i.tanggal + 'T' + i.selesai, 
        extendedProps: i
      })));

      renderTable();
    }

    function renderTable() {
      var html = '';
      filteredData.forEach(item => {
        var vKaur = item.verifKaur || "PENDING";
        var badge = vKaur === "DISETUJUI" ? "bg-success" : vKaur === "DITOLAK" ? "bg-danger" : "bg-secondary";
        
        // FORMAT TANGGAL: ddd, DD MMM YY (Contoh: Sen, 09 Feb 26)
        var formatTgl = moment(item.tanggal).format('ddd, DD MMM YY');

        html += `<tr>
          <td class="text-nowrap"><strong>${formatTgl}</strong></td>
          <td class="fw-bold">${item.namaKegiatan}</td>
          <td><span class="badge bg-info text-dark">${item.ruang}</span></td>
          <td class="text-nowrap">${item.mulai} - ${item.selesai}</td>
          <td>${item.pemohon}</td>
          <td><span class="badge ${badge}">${vKaur}</span></td>
        </tr>`;
      });
      document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="6" class="text-center p-4">Tidak ada jadwal ditemukan.</td></tr>';
    }

    function showDetail(props) {

      document.getElementById('modalContent').innerHTML = `
        <div class="mb-3">
          <label class="text-muted small d-block">KEGIATAN</label>
          <span class="h6 text-primary fw-bold">${props.namaKegiatan}</span>
        </div>
        <div class="row mb-3">
          <div class="col-6"><label class="text-muted small d-block">RUANGAN</label><strong>${props.ruang}</strong></div>
          <div class="col-6"><label class="text-muted small d-block">WAKTU</label><strong class="text-danger">${props.mulai} - ${props.selesai}</strong></div>
        </div>
        <div class="mb-3">
          <label class="text-muted small d-block">PEMOHON</label>
          <strong>${props.pemohon}</strong> 
          <a href="https://wa.me/${props.noHp}" target="_blank" class="badge bg-success text-decoration-none ms-1">WhatsApp</a>
        </div>
        <div class="row">
          <div class="col-6"><label class="text-muted small d-block">VERIF ULT</label><span class="badge bg-warning text-dark">${props.verifUlt}</span></div>
          <div class="col-6"><label class="text-muted small d-block">VERIF KAUR</label><span class="badge bg-secondary">${props.verifKaur || 'PROSES'}</span></div>
        </div>
      `;
      bootstrapModal.show();
    }

    function switchView(viewId, btn) {
      $('.btn-group .btn').removeClass('btn-primary active').addClass('btn-outline-primary');
      $(btn).removeClass('btn-outline-primary').addClass('btn-primary active');
      $('#calendar-view, #table-view').addClass('hidden');
      $('#' + viewId).removeClass('hidden');
      if(viewId === 'calendar-view') setTimeout(() => calendar.render(), 100);
    }
  </script>
</body>
</html>
